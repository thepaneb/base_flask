version: 2
updates:
  # uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  # Imagem base do Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  # Actions do CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
