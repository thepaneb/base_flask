name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run bandit -r app -q
      - run: uv run pytest --cov=app --cov-report=term --cov-fail-under=90 -v
      - run: uv run pip-audit --desc
      - name: banco e migrations a partir do zero
        run: |
          rm -f /tmp/check.db
          DATABASE_URL=sqlite:////tmp/check.db uv run flask --app app db upgrade
          DATABASE_URL=sqlite:////tmp/check.db uv run flask --app app db check
      - name: SBOM (CycloneDX)
        run: uv run pip-audit --format=cyclonedx-json --output sbom.json --desc
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - uses: pre-commit/action@v3.0.1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t base-flask .
      - run: docker compose up -d --wait --wait-timeout 120
      - name: smoke test
        run: |
          set -e
          curl -fsS http://127.0.0.1:40000/v1/live | grep -q '"status": *"ok"'
          curl -fsS http://127.0.0.1:40000/v1/status | grep -q '"database": *"ok"'
          curl -fsS http://127.0.0.1:40000/openapi.json | grep -q '"openapi"'
          curl -fsS -X POST http://127.0.0.1:40000/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"s3cret"}' | grep -q '"username": *"ci"'
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:40000/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"s3cret"}' | grep -o '"access_token": *"[^"]*"' | cut -d'"' -f4)
          curl -fsS http://127.0.0.1:40000/v1/auth/me -H "Authorization: Bearer $TOKEN" | grep -q '"username": *"ci"'
          curl -fsS -X POST http://127.0.0.1:40000/v1/visits/ \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"CI"}' | grep -q '"name": *"CI"'
      - run: docker compose down -v
