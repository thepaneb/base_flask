[project]
name = "base-flask"
version = "0.1.0"
description = "Base Flask Project"
requires-python = ">=3.15"
dependencies = [
    "flask==3.1.3",
    "flask-smorest==0.47.0",
    "flask-sqlalchemy==3.1.1",
    "gunicorn==27.0.0",
    "marshmallow==4.4.0",
    "tzdata==2026.6",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
