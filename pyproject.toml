[project]
name = "base-flask"
version = "0.1.0"
description = "Base Flask Project"
requires-python = ">=3.15"
dependencies = [
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "flask-jwt-extended==4.7.4",
    "flask-limiter==4.1.1",
    "flask-migrate==4.1.0",
    "flask-smorest==0.47.0",
    "flask-sqlalchemy==3.1.1",
    "gunicorn==27.0.0",
    "marshmallow==4.4.0",
    "prometheus-client==0.26.0",
    "tzdata==2026.6",
]

[dependency-groups]
dev = [
    "openapi-spec-validator==0.9.0",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
